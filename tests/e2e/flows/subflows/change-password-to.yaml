appId: dev.thunderid.Quickstart
---
# Opens the ChangeCredential dialog from the Manage Account screen's "Change Password" row,
# submits CURRENT_PASSWORD as the current value and NEW_PASSWORD as both the new value and its
# confirmation, and waits for the dialog to
# auto-dismiss (ChangeCredential's own success behavior - there is no separate on-screen
# confirmation).
#
# The submit button is targeted by id, not by its visible text: the button's label
# ("Change Password", from changeCredential.submit) is identical to the dialog's own header text
# (changeCredential.heading), so tapOn by text would be ambiguous between the two.
- tapOn: "Change Password"
- extendedWaitUntil:
    visible:
      id: "thunderid-field-newCredential"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    id: "thunderid-field-currentCredential"
- inputText: ${CURRENT_PASSWORD}
- tapOn:
    id: "thunderid-field-newCredential"
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: "thunderid-field-confirmCredential"
- inputText: ${NEW_PASSWORD}

- tapOn:
    id: "thunderid-action-submitCredential"

# The dialog auto-dismisses on success, so the row's own heading becomes visible again.
- extendedWaitUntil:
    visible: "Change Password"
    timeout: 20000

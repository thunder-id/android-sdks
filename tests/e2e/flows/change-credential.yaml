appId: dev.thunderid.Quickstart
name: Change password from Manage Account
tags:
  - account
env:
  E2E_USERNAME: e2e_mobile_user
  E2E_PASSWORD: TestPassword@123
  # This flow actually changes E2E_PASSWORD on the shared E2E user via the real backend, so it
  # changes to this value and back to E2E_PASSWORD before finishing. If this flow fails between
  # those two changes, the E2E user is left on this password, not E2E_PASSWORD, until it is reset.
  E2E_TEMP_PASSWORD: TempPassword@456
---
- launchApp:
    clearState: true
- runFlow: subflows/ensure-signed-out.yaml

# Change away from E2E_PASSWORD, then back, so the E2E user's credential is unchanged once this
# flow finishes, matching signin.yaml's "leaves the app as it found it" convention. Replacing a
# password revokes the user's tokens, so the change back runs in a new session signed in with
# the temporary password.
- runFlow:
    file: subflows/sign-in-to-manage-account.yaml
    env:
      USERNAME: ${E2E_USERNAME}
      PASSWORD: ${E2E_PASSWORD}
- runFlow:
    file: subflows/change-password-to.yaml
    env:
      CURRENT_PASSWORD: ${E2E_PASSWORD}
      NEW_PASSWORD: ${E2E_TEMP_PASSWORD}
- runFlow: subflows/sign-out-from-manage-account.yaml

- runFlow:
    file: subflows/sign-in-to-manage-account.yaml
    env:
      USERNAME: ${E2E_USERNAME}
      PASSWORD: ${E2E_TEMP_PASSWORD}
- runFlow:
    file: subflows/change-password-to.yaml
    env:
      CURRENT_PASSWORD: ${E2E_TEMP_PASSWORD}
      NEW_PASSWORD: ${E2E_PASSWORD}
- runFlow: subflows/sign-out-from-manage-account.yaml
